org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental compiler crashes computing relative paths when the
# project (D:) and the Flutter/Gradle package caches (C:) are on different
# Windows drives. Disabling incremental compilation avoids that crash.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template. Must stay
# false: flutter_plugin_android_lifecycle (a transitive dep of several
# plugins) still applies the legacy org.jetbrains.kotlin.android plugin,
# which conflicts with AGP 9's built-in-Kotlin-by-default when this is true.
android.builtInKotlin=false
